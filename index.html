        '<td>' + esc(it.unit) + '</td>' +
        '<td style="font-size:12px">' + (short ? '<span class="badge bg-red">🔴 ขาด ' + fmt(num(it.requested_quantity) - stock) + '</span> <button class="btn btn-ghost btn-sm" onclick="nav(\'purchase\')">🛒 เพิ่มในแผนสั่งซื้อ</button>' : esc(it.note || '')) + '</td>' +
        (editable ? '<td class="c"><button class="btn btn-ghost btn-sm" onclick="PAGES.requisition.delItem(' + i + ')">🗑</button></td>' : '') +
        '</tr>';
    });
    h += '</tbody></table></div>';

    h += '<div style="margin-top:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">';
    if (editable) {
      h += '<div class="search-box" style="min-width:230px"><input class="inp" list="dlIngredients" id="rqAddIng" placeholder="➕ พิมพ์เพื่อเพิ่มวัตถุดิบ…" onchange="PAGES.requisition.addItem(this)"></div>';
      h += '<span class="grow"></span>';
      h += '<button class="btn btn-outline" id="btnRqDraft" onclick="PAGES.requisition.save(false)">💾 บันทึก Draft</button>';
      h += '<button class="btn btn-primary" id="btnRqSubmit" onclick="PAGES.requisition.save(true)">📨 ส่งขออนุมัติ</button>';
      if (!ed.isNew) h += '<button class="btn btn-ghost" onclick="PAGES.requisition.cancel(\'' + r.requisition_id + '\')">ยกเลิกใบเบิก</button>';
    } else if (r.status === 'approved' && canApprove) {
      h += '<span class="grow"></span><button class="btn btn-success" id="btnRqIssue" onclick="PAGES.requisition.issue(\'' + r.requisition_id + '\',false)">📦 จ่ายวัตถุดิบ (ตัด Stock)</button>';
    }
    h += '</div></div>';
    el('reqDetail').innerHTML = h;
  },
  addItem: function(input) {
    var g = ingByName(input.value);
    if (!g) { if (input.value) toast('⚠️ ไม่พบวัตถุดิบนี้', 'warning'); return; }
    var ed = this.st.edit;
    var dup = ed.items.filter(function(it) { return it.ingredient_id === g.ingredient_id; })[0];
    if (dup) { toast('⚠️ มีวัตถุดิบนี้ในใบเบิกแล้ว', 'warning'); input.value = ''; return; }
    var stockRow = APP.stock.filter(function(b) { return b.ingredient_id === g.ingredient_id; })[0];
    ed.items.push({
      requisition_item_id: '', ingredient_id: g.ingredient_id, ingredient_name: g.ingredient_name,
      unit: g.default_unit, recipe_quantity: 0, recommended_quantity: 0, requested_quantity: 1,
      current_available: stockRow ? num(stockRow.available_balance) : 0, note: ''
    });
    input.value = '';
    this.drawDetail();
  },
  delItem: function(i) { this.st.edit.items.splice(i, 1); this.drawDetail(); },
  save: function(submit) {
    var self = this;
    var ed = self.st.edit;
    var items = ed.items.filter(function(it) { return num(it.requested_quantity) > 0; })
      .map(function(it) { return { ingredient_id: it.ingredient_id, requested_quantity: num(it.requested_quantity), note: it.note }; });
    if (!items.length) { toast('⚠️ กรุณาระบุจำนวนเบิกอย่างน้อย 1 รายการ', 'warning'); return; }
    var btn = submit ? 'btnRqSubmit' : 'btnRqDraft';
    btnBusy(btn, true, submit ? 'กำลังส่ง…' : 'กำลังบันทึก…');
    api('createRequisition', {
      requisition_id: ed.isNew ? undefined : ed.requisition.requisition_id,
      requisition_date: ed.requisition.requisition_date,
      location_id: ed.isNew ? el('rqLoc').value : ed.requisition.location_id,
      meal_period: ed.requisition.meal_period, submit: !!submit, items: items
    }).then(function(res) {
      btnBusy(btn, false);
      toast((res.success ? '' : '❌ ') + res.message, res.success ? 'success' : 'error');
      if (res.success) { self.load(submit ? null : res.data.requisition_id); if (submit) self.st.edit = null; refreshMaster(true); }
    }).catch(function() { btnBusy(btn, false); });
  },
  cancel: function(reqId) {
    var self = this;
    UI.confirm('ยกเลิกใบเบิก', 'ต้องการยกเลิกใบเบิกนี้ใช่หรือไม่?', 'ยกเลิกใบเบิก', 'btn-danger').then(function(okay) {
      if (!okay) return;
      api('cancelRequisition', { requisition_id: reqId }).then(function(res) {
        toast((res.success ? '✅ ' : '❌ ') + res.message, res.success ? 'success' : 'error');
        if (res.success) { self.st.edit = null; self.drawDetail(); self.load(); }
      });
    });
  },
  duplicate: function(reqId) {
    var self = this;
    api('duplicateRequisition', reqId).then(function(res) {
      toast((res.success ? '✅ ' : '❌ ') + res.message, res.success ? 'success' : 'error');
      if (res.success) self.load(res.data.requisition_id);
    });
  },
  issue: function(reqId, allowNegative) {
    var self = this;
    UI.confirm('จ่ายวัตถุดิบ', 'ยืนยันจ่ายวัตถุดิบและตัด Stock ตามจำนวนที่อนุมัติ?', 'จ่ายวัตถุดิบ', 'btn-success').then(function(okay) {
      if (!okay) return;
      api('issueRequisition', { requisition_id: reqId, allow_negative: allowNegative }).then(function(res) {
        if (!res.success && res.code === 'INSUFFICIENT_STOCK') {
          UI.confirm('⚠️ Stock ไม่เพียงพอ', res.message + '\n\nต้องการจ่ายต่อ (Stock จะติดลบ) หรือไม่?', 'จ่ายต่อ (ยอมติดลบ)', 'btn-danger')
            .then(function(force) {
              if (!force) return;
              api('issueRequisition', { requisition_id: reqId, allow_negative: true }).then(function(res2) {
                toast((res2.success ? '' : '❌ ') + res2.message, res2.success ? 'success' : 'error');
                if (res2.success) { self.load(reqId); refreshMaster(true); }
              });
            });
          return;
        }
        toast((res.success ? '' : '❌ ') + res.message, res.success ? 'success' : 'error');
        if (res.success) { self.load(reqId); refreshMaster(true); }
      });
    });
  },
  print: function() {
    var ed = this.st.edit;
    if (!ed || ed.isNew) { toast('⚠️ บันทึกใบเบิกก่อนพิมพ์', 'warning'); return; }
    var r = ed.requisition;
    var rows = ed.items.filter(function(it) { return num(it.requested_quantity) > 0; });
    var qtyField = r.status === 'issued' ? 'actual_quantity' : (r.status === 'approved' ? 'approved_quantity' : 'requested_quantity');
    var h = printHeader('ใบเบิกวัตถุดิบ (Requisition)',
      'เลขที่ ' + esc(r.requisition_no) + ' · วันที่ ' + thaiDate(r.requisition_date) +
      ' · Location: ' + esc(r.location_name) + ' · ช่วงอาหาร: ' + esc(r.meal_period));
    h += '<table><thead><tr><th style="width:44px">ลำดับ</th><th>วัตถุดิบ</th><th>หน่วย</th><th style="text-align:right">จำนวน</th><th>หมายเหตุ</th></tr></thead><tbody>';
    rows.forEach(function(it, i) {
      h += '<tr><td style="text-align:center">' + (i + 1) + '</td><td>' + esc(it.ingredient_name) + '</td>' +
        '<td>' + esc(it.unit) + '</td><td style="text-align:right">' + fmt(num(it[qtyField]) || num(it.requested_quantity)) + '</td>' +
        '<td>' + esc(it.note || '') + '</td></tr>';
    });
    h += '</tbody></table>';
    h += '<div class="p-sign"><div>ผู้เบิก<br>(' + esc(r.requested_by) + ')</div><div>ผู้ตรวจสอบ<br>&nbsp;</div><div>ผู้อนุมัติ<br>' + (r.approved_by ? '(' + esc(r.approved_by) + ')' : '&nbsp;') + '</div></div>';
    printHTML(h);
  }
};

/* ═══════════════════ PAGE: APPROVAL ═══════════════════ */
PAGES.approval = {
  st: { page: 1, per: 10 },
  setPage: function(p) { this.st.page = p; this.draw(); },
  setPer: function(p) { this.st.per = num(p); this.st.page = 1; this.draw(); },
  render: function() {
    el('content').innerHTML = '<div class="info-strip"><span>รายการใบเบิกที่ <b>รออนุมัติ</b> — ตรวจสอบจำนวนและกดอนุมัติ/ปฏิเสธ</span></div>' +
      '<div id="apList"></div><div id="apDetail"></div>';
    this.load();
  },
  load: function() {
    var self = this, seq = nextSeq();
    api('listRequisitions', { status: 'pending', date_from: addDays(todayStr(), -60), date_to: addDays(todayStr(), 7) })
      .then(function(res) {
        if (!isLatest(seq) || APP.page !== 'approval') return;
        if (!res.success) { toast('❌ ' + res.message, 'error'); return; }
        self.list = res.data;
        self.draw();
        refreshMaster(true);
      });
  },
  draw: function() {
    var self = this;
    var ps = pageSlice(self.list || [], self.st.page, self.st.per);
    self.st.page = ps.page;
    el('apList').innerHTML = tableHTML([
      { key: 'requisition_no', label: 'เลขที่' },
      { key: 'requisition_date', label: 'วันที่' },
      { key: 'location_name', label: 'Location' },
      { key: 'meal_period', label: 'ช่วงอาหาร' },
      { key: 'requested_by', label: 'ผู้เบิก' },
      { key: '_a', label: '', render: function(r) {
          return '<button class="btn btn-primary btn-sm" onclick="PAGES.approval.open(\'' + r.requisition_id + '\')">ตรวจสอบ</button>';
        } }
    ], ps.rows) + pagerHTML(ps, 'PAGES.approval');
  },
  open: function(reqId) {
    var self = this, seq = nextSeq();
    el('apDetail').innerHTML = '<div class="empty-state"><div class="spinner dark" style="margin:16px auto"></div></div>';
    api('getRequisition', reqId).then(function(res) {
      if (!isLatest(seq) || APP.page !== 'approval') return;
      if (!res.success) { toast('❌ ' + res.message, 'error'); return; }
      self.cur = res.data;
      var r = res.data.requisition;
      var h = '<div class="card" style="margin-top:16px"><div class="card-head"><h3>✅ ตรวจสอบใบเบิก ' + esc(r.requisition_no) + '</h3>' +
        statusBadge(r.status) + '<span class="grow"></span>' +
        '<button class="btn btn-ghost btn-sm" onclick="el(\'apDetail\').innerHTML=\'\'">✕ ปิด</button></div>' +
        '<div class="info-strip"><span>วันที่ <b>' + thaiDate(r.requisition_date) + '</b></span>' +
        '<span>Location <b>' + esc(r.location_name) + '</b></span><span>ผู้เบิก <b>' + esc(r.requested_by) + '</b></span></div>';
      if (r.note) h += '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:11px">📝 ' + esc(r.note) + '</div>';
      h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>วัตถุดิบ</th><th class="r">ตามสูตร</th><th class="r">Stock พร้อมใช้</th><th class="r">ขอเบิก</th><th class="r">อนุมัติ</th><th>หน่วย</th><th></th></tr></thead><tbody>';
      res.data.items.forEach(function(it, i) {
        if (num(it.requested_quantity) <= 0) return;
        var short = num(it.requested_quantity) > num(it.current_available);
        h += '<tr><td><b>' + esc(it.ingredient_name) + '</b></td>' +
          '<td class="r">' + fmt(it.recipe_quantity) + '</td>' +
          '<td class="r" style="' + (short ? 'color:var(--danger);font-weight:600' : '') + '">' + fmt(it.current_available) + '</td>' +
          '<td class="r"><b>' + fmt(it.requested_quantity) + '</b></td>' +
          '<td class="r"><input type="number" step="0.001" min="0" class="num-inp" id="apq_' + i + '" value="' + num(it.requested_quantity) + '"></td>' +
          '<td>' + esc(it.unit) + '</td>' +
          '<td>' + (short ? '<span class="badge bg-red">🔴 เกิน Stock</span>' : '') + '</td></tr>';
      });
      h += '</tbody></table></div>' +
        '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end">' +
        '<button class="btn btn-danger" onclick="PAGES.approval.reject(\'' + r.requisition_id + '\')">❌ ปฏิเสธ</button>' +
        '<button class="btn btn-success" id="btnApGo" onclick="PAGES.approval.approve(\'' + r.requisition_id + '\')">✅ อนุมัติตามจำนวนที่ระบุ</button></div></div>';
      el('apDetail').innerHTML = h;
      el('apDetail').scrollIntoView({ behavior: 'smooth' });
    });
  },
  approve: function(reqId) {
    var self = this;
    var items = [];
    (self.cur.items || []).forEach(function(it, i) {
      var inp = el('apq_' + i);
      if (inp) items.push({ requisition_item_id: it.requisition_item_id, approved_quantity: num(inp.value) });
    });
    btnBusy('btnApGo', true, 'กำลังอนุมัติ…');
    api('approveRequisition', { requisition_id: reqId, items: items }).then(function(res) {
      btnBusy('btnApGo', false);
      toast((res.success ? '' : '❌ ') + res.message, res.success ? 'success' : 'error');
      if (res.success) { el('apDetail').innerHTML = ''; self.load(); }
    }).catch(function() { btnBusy('btnApGo', false); });
  },
  reject: function(reqId) {
    var self = this;
    UI.promptReason('❌ ปฏิเสธใบเบิก', 'เหตุผลที่ปฏิเสธ เช่น จำนวนเกินความจำเป็น').then(function(reason) {
      if (!reason) return;
      api('rejectRequisition', { requisition_id: reqId, reason: reason }).then(function(res) {
        toast((res.success ? '✅ ' : '❌ ') + res.message, res.success ? 'success' : 'error');
        if (res.success) { el('apDetail').innerHTML = ''; self.load(); }
      });
    });
  }
};

/* ═══════════════════ PAGE: TRANSFER ═══════════════════ */
PAGES.transfer = {
  st: { items: [], page: 1, per: 10 },
  setPage: function(p) { this.st.page = p; this.drawHistory(); },
  setPer: function(p) { this.st.per = num(p); this.st.page = 1; this.drawHistory(); },
  render: function() {
    var self = this;
    self.st.items = [{ name: '', qty: '' }];
    var canWrite = ['Admin', 'Supervisor'].indexOf(APP.user.role) !== -1;
    var h = '';
    if (canWrite) {
      var locs = APP.locations;
      h += '<div class="card"><div class="card-head"><h3>🔄 โอนวัตถุดิบระหว่างคลัง</h3></div>' +
        '<div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">' +
        '<div class="field"><label>วันที่โอน</label><input type="date" class="inp" id="trDate" value="' + todayStr() + '"></div>' +
        '<div class="field"><label>จากคลัง *</label><select class="sel" style="width:100%" id="trFrom">' +
        selOptions(locs, 'location_id', 'location_name', locs.length ? locs[0].location_id : '') + '</select></div>' +
        '<div class="field"><label>ไปคลัง *</label><select class="sel" style="width:100%" id="trTo">' +
        selOptions(locs, 'location_id', 'location_name', locs.length > 1 ? locs[1].location_id : '') + '</select></div>' +
        '<div class="field"><label>หมายเหตุ</label><input class="inp" id="trNote"></div></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="min-width:190px">วัตถุดิบ</th><th class="r">จำนวนโอน</th><th>หน่วย</th><th></th></tr></thead><tbody id="trRows"></tbody></table></div>' +
        '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn btn-outline btn-sm" onclick="PAGES.transfer.addRow()">➕ เพิ่มรายการ</button>' +
        '<span class="grow"></span>' +
        '<button class="btn btn-primary" id="btnTrSave" onclick="PAGES.transfer.save()">🔄 ยืนยันการโอน</button></div></div>' + ingDatalist();
    }
    h += '<div class="section-title">ประวัติการโอน</div><div class="toolbar">' +
      '<input type="date" class="inp" style="width:auto" id="trHistFrom" value="' + addDays(todayStr(), -30) + '" onchange="PAGES.transfer.loadHistory()">' +
      '<span>ถึง</span><input type="date" class="inp" style="width:auto" id="trHistTo" value="' + todayStr() + '" onchange="PAGES.transfer.loadHistory()"></div>' +
      '<div id="trHistTable"></div>';
    el('content').innerHTML = h;
    if (canWrite) this.drawRows();
    this.loadHistory();
  },
  addRow: function() { this.st.items.push({ name: '', qty: '' }); this.drawRows(); },
  delRow: function(i) { this.st.items.splice(i, 1); if (!this.st.items.length) this.addRow(); this.drawRows(); },
  drawRows: function() {
    var self = this;
    el('trRows').innerHTML = self.st.items.map(function(it, i) {
      var g = ingByName(it.name);
      return '<tr>' +
        '<td><input class="inp" list="dlIngredients" value="' + esc(it.name) + '" placeholder="พิมพ์เพื่อค้นหา…" onchange="PAGES.transfer.st.items[' + i + '].name=this.value;PAGES.transfer.drawRows()"></td>' +
        '<td class="r"><input type="number" step="0.001" min="0" class="num-inp" value="' + esc(it.qty) + '" onchange="PAGES.transfer.st.items[' + i + '].qty=this.value"></td>' +
        '<td>' + esc(g ? g.default_unit : '—') + '</td>' +
        '<td class="c"><button class="btn btn-ghost btn-sm" onclick="PAGES.transfer.delRow(' + i + ')">🗑</button></td></tr>';
    }).join('');
  },
  save: function() {
    var self = this;
    if (el('trFrom').value === el('trTo').value) { toast('⚠️ คลังต้นทางและปลายทางต้องต่างกัน', 'warning'); return; }
    var items = [];
    for (var i = 0; i < self.st.items.length; i++) {
      var it = self.st.items[i];
      if (!it.name && !num(it.qty)) continue;
      var g = ingByName(it.name);
      if (!g) { toast('⚠️ แถวที่ ' + (i + 1) + ': กรุณาเลือกวัตถุดิบจากรายการ', 'warning'); return; }
      if (num(it.qty) <= 0) { toast('⚠️ แถวที่ ' + (i + 1) + ': จำนวนต้องมากกว่า 0', 'warning'); return; }
      items.push({ ingredient_id: g.ingredient_id, quantity: num(it.qty), unit: g.default_unit });
    }
    if (!items.length) { toast('⚠️ กรุณาเพิ่มรายการที่ต้องการโอน', 'warning'); return; }
    btnBusy('btnTrSave', true, 'กำลังโอน…');
    api('createTransfer', {
      transfer_date: el('trDate').value, from_location: el('trFrom').value,
      to_location: el('trTo').value, note: el('trNote').value.trim(), items: items
    }).then(function(res) {
      btnBusy('btnTrSave', false);
      if (!res.success) {
        if (res.code === 'INSUFFICIENT_STOCK') toast(res.message, 'warning');
        else toast('❌ ' + res.message, 'error');
        return;
      }
      toast('✅ ' + res.message, 'success');
      refreshMaster(true);
      PAGES.transfer.render();
    }).catch(function() { btnBusy('btnTrSave', false); });
  },
  loadHistory: function() {
    var self = this, seq = nextSeq();
    api('listTransfers', { date_from: el('trHistFrom').value, date_to: el('trHistTo').value })
      .then(function(res) {
        if (!isLatest(seq) || APP.page !== 'transfer') return;
        if (!res.success) return;
        self.history = res.data;
        self.drawHistory();
      });
  },
  drawHistory: function() {
    var canWrite = ['Admin', 'Supervisor'].indexOf(APP.user.role) !== -1;
    var ps = pageSlice(this.history || [], this.st.page, this.st.per);
    this.st.page = ps.page;
    el('trHistTable').innerHTML = tableHTML([
      { key: 'transfer_date', label: 'วันที่' },
      { key: 'transfer_no', label: 'เลขที่' },
      { key: 'ingredient_name', label: 'วัตถุดิบ' },
      { key: 'quantity', label: 'จำนวน', type: 'num' },
      { key: 'unit', label: 'หน่วย' },
      { key: 'from_location_name', label: 'จาก' },
      { key: 'to_location_name', label: 'ไป' },
      { key: 'status', label: 'สถานะ', type: 'status' },
      { key: 'created_by', label: 'ผู้โอน' },
      { key: '_a', label: '', render: function(t) {
          return (canWrite && !t.received_by) ?
            '<button class="btn btn-outline btn-sm" onclick="PAGES.transfer.receive(\'' + esc(t.transfer_no) + '\')">✔ รับโอน</button>' :
            (t.received_by ? '<span style="font-size:12px;color:var(--text-3)">รับโดย ' + esc(t.received_by) + '</span>' : '');
        } }
    ], ps.rows) + pagerHTML(ps, 'PAGES.transfer');
  },
  receive: function(transferNo) {
    var self = this;
    api('receiveTransfer', transferNo).then(function(res) {
      toast((res.success ? '✅ ' : '❌ ') + res.message, res.success ? 'success' : 'error');
      if (res.success) self.loadHistory();
    });
  }
};

/* ═══════════════════ PAGE: PURCHASE PLAN ═══════════════════ */
PAGES.purchase = {
  st: { tab: 'suggest', items: [], page: 1, per: 10 },
  setPage: function(p) { this.st.page = p; this.drawHistory(); },
  setPer: function(p) { this.st.per = num(p); this.st.page = 1; this.drawHistory(); },
  render: function() {
    var s = this.st;
    el('content').innerHTML =
      '<div class="tabs">' +
      '<button class="' + (s.tab === 'suggest' ? 'active' : '') + '" onclick="PAGES.purchase.st.tab=\'suggest\';PAGES.purchase.render()">🛒 แนะนำสั่งซื้อ</button>' +
      '<button class="' + (s.tab === 'history' ? 'active' : '') + '" onclick="PAGES.purchase.st.tab=\'history\';PAGES.purchase.render()">📜 แผนสั่งซื้อที่บันทึก</button>' +
      '</div><div id="ppBody"></div>';
    if (s.tab === 'suggest') this.renderSuggest();
    else this.renderHistory();
  },
  renderSuggest: function() {
    el('ppBody').innerHTML =
      '<div class="toolbar">' +
      '<label style="font-size:13px;color:var(--text-2)">คำนวณจากแผนเมนู:</label>' +
      '<input type="date" class="inp" style="width:auto" id="ppFrom" value="' + todayStr() + '">' +
      '<span>ถึง</span><input type="date" class="inp" style="width:auto" id="ppTo" value="' + addDays(todayStr(), 2) + '">' +
      '<select class="sel" id="ppLoc">' + selOptions(APP.locations, 'location_id', 'location_code', '', 'ทุกคลัง') + '</select>' +
      '<button class="btn btn-primary" id="btnPpCalc" onclick="PAGES.purchase.calc()">🧮 คำนวณ</button>' +
      '<span class="grow"></span>' +
      '<button class="btn btn-outline" onclick="PAGES.purchase.exportSuggest()">📊 Excel</button>' +
      '</div>' +
      '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:12px">สูตร: แนะนำซื้อ = ต้องใช้ตามแผน + Safety Stock − Stock พร้อมใช้ (ระบบไม่สั่งซื้อจริงอัตโนมัติ — ตรวจสอบและยืนยันก่อน)</div>' +
      '<div id="ppSuggest"></div>';
    this.calc();
  },
  calc: function() {
    var self = this, seq = nextSeq();
    el('ppSuggest').innerHTML = '<div class="empty-state"><div class="spinner dark" style="margin:16px auto"></div>กำลังคำนวณ…</div>';
    api('calculatePurchaseSuggestion', { date_from: el('ppFrom').value, date_to: el('ppTo').value, location_id: el('ppLoc').value })
      .then(function(res) {
        if (!isLatest(seq) || APP.page !== 'purchase') return;
        if (!res.success) { toast('❌ ' + res.message, 'error'); return; }
        self.st.items = res.data.items.map(function(it) { it.final_quantity = it.recommended_purchase; return it; });
        self.drawSuggest();
      });
  },
  drawSuggest: function() {
    var self = this;
    var items = self.st.items;
    if (!items.length) {
      el('ppSuggest').innerHTML = '<div class="card"><div class="empty-state"><div class="e-ico">✅</div>ไม่มีรายการที่ต้องสั่งซื้อตอนนี้</div></div>';
      return;
    }
    var canWrite = ['Admin', 'Supervisor'].indexOf(APP.user.role) !== -1;
    // Group by Vendor
    var byVendor = {};
    items.forEach(function(it, idx) {
      it._idx = idx;
      (byVendor[it.vendor_name] = byVendor[it.vendor_name] || []).push(it);
    });
    var total = items.reduce(function(sum, it) { return sum + num(it.final_quantity) * num(it.last_price); }, 0);
    var h = '<div class="info-strip"><span>รวม <b>' + items.length + '</b> รายการ</span><span>ประมาณการ <b id="ppTotalTxt">' + money(total) + '</b></span></div>';
    Object.keys(byVendor).sort(function(a, b) { return a.localeCompare(b, 'th'); }).forEach(function(vn) {
      var list = byVendor[vn];
      var vTotal = list.reduce(function(sum, it) { return sum + num(it.final_quantity) * num(it.last_price); }, 0);
      h += '<div class="card"><div class="card-head"><h3>🏪 ' + esc(vn) + '</h3>' +
        '<span class="badge bg-blue">' + list.length + ' รายการ</span><span class="grow"></span>' +
        '<b>' + money(vTotal) + '</b></div>';
      h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>วัตถุดิบ</th><th class="r">Stock</th><th class="r">ต้องใช้</th><th class="r">Safety</th><th class="r">แนะนำซื้อ</th><th class="r">สั่งจริง</th><th>หน่วย</th><th class="r">ราคา</th><th class="r">รวม</th><th>สถานะ</th></tr></thead><tbody>';
      list.forEach(function(it) {
        h += '<tr><td><b>' + esc(it.ingredient_name) + '</b></td>' +
          '<td class="r">' + fmt(it.current_stock) + '</td>' +
          '<td class="r">' + fmt(it.required_quantity) + '</td>' +
          '<td class="r">' + fmt(it.safety_stock) + '</td>' +
          '<td class="r"><b>' + fmt(it.recommended_purchase) + '</b></td>' +
          '<td class="r">' + (canWrite ? '<input type="number" step="0.001" min="0" class="num-inp" value="' + num(it.final_quantity) + '" onchange="PAGES.purchase.setFinal(' + it._idx + ',this.value)">' : fmt(it.final_quantity)) + '</td>' +
          '<td>' + esc(it.unit) + '</td>' +
          '<td class="r">' + money(it.last_price) + '</td>' +
          '<td class="r">' + money(num(it.final_quantity) * num(it.last_price)) + '</td>' +
          '<td>' + statusBadge(it.stock_status) + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    });
    if (canWrite) {
      h += '<div class="card"><div class="card-head"><h3>บันทึกเป็นแผนสั่งซื้อ</h3><span class="grow"></span>' +
        '<label style="font-size:13px;color:var(--text-2)">ต้องการของวันที่</label>' +
        '<input type="date" class="inp" style="width:auto" id="ppReqDate" value="' + addDays(todayStr(), 1) + '">' +
        '<button class="btn btn-success" id="btnPpSave" onclick="PAGES.purchase.savePlan()">💾 สร้าง Purchase Plan</button></div>' +
        '<div style="font-size:12.5px;color:var(--text-2)">รายการที่จำนวนสั่งจริง = 0 จะไม่ถูกบันทึก</div></div>';
    }
    el('ppSuggest').innerHTML = h;
  },
  setFinal: function(idx, val) {
    this.st.items[idx].final_quantity = num(val);
    var total = this.st.items.reduce(function(sum, it) { return sum + num(it.final_quantity) * num(it.last_price); }, 0);
    if (el('ppTotalTxt')) el('ppTotalTxt').textContent = money(total);
  },
  exportSuggest: function() {
    if (!this.st.items.length) { toast('⚠️ ไม่มีข้อมูลให้ Export', 'warning'); return; }
    exportExcel('purchase_suggestion_' + todayStr(), [
      { key: 'vendor_name', label: 'Vendor' }, { key: 'ingredient_name', label: 'วัตถุดิบ' },
      { key: 'current_stock', label: 'Stock' }, { key: 'required_quantity', label: 'ต้องใช้' },
      { key: 'safety_stock', label: 'Safety' }, { key: 'recommended_purchase', label: 'แนะนำซื้อ' },
      { key: 'final_quantity', label: 'สั่งจริง' }, { key: 'unit', label: 'หน่วย' },
      { key: 'last_price', label: 'ราคา/หน่วย' }, { key: 'estimated_amount', label: 'ประมาณการ' }
    ], this.st.items);
  },
  savePlan: function() {
    var self = this;
    var items = self.st.items.filter(function(it) { return num(it.final_quantity) > 0; })
      .map(function(it) {
        return { ingredient_id: it.ingredient_id, vendor_id: it.vendor_id,
          current_stock: it.current_stock, required_quantity: it.required_quantity,
          recommended_purchase: it.recommended_purchase, final_quantity: it.final_quantity };
      });
    if (!items.length) { toast('⚠️ ไม่มีรายการที่จำนวนสั่งมากกว่า 0', 'warning'); return; }
    btnBusy('btnPpSave', true);
    api('createPurchasePlan', { required_date: el('ppReqDate').value, items: items }).then(function(res) {
      btnBusy('btnPpSave', false);
      toast((res.success ? '' : '❌ ') + res.message, res.success ? 'success' : 'error');
      if (res.success) { self.st.tab = 'history'; self.render(); }
    }).catch(function() { btnBusy('btnPpSave', false); });
  },
  renderHistory: function() {
    el('ppBody').innerHTML = '<div class="toolbar">' +
      '<input type="date" class="inp" style="width:auto" id="ppHFrom" value="' + addDays(todayStr(), -30) + '" onchange="PAGES.purchase.loadHistory()">' +
      '<span>ถึง</span><input type="date" class="inp" style="width:auto" id="ppHTo" value="' + todayStr() + '" onchange="PAGES.purchase.loadHistory()">' +
      '<span class="grow"></span><button class="btn btn-outline btn-sm" onclick="PAGES.purchase.printPlans()">🖨 พิมพ์</button></div>' +
      '<div id="ppHistTable"></div>';
    this.loadHistory();
  },
  loadHistory: function() {
    var self = this, seq = nextSeq();
    api('listPurchasePlans', { date_from: el('ppHFrom').value, date_to: el('ppHTo').value })
      .then(function(res) {
        if (!isLatest(seq) || APP.page !== 'purchase') return;
        if (!res.success) return;
        self.history = res.data;
        self.drawHistory();
      });
  },
  drawHistory: function() {
    var canWrite = ['Admin', 'Supervisor'].indexOf(APP.user.role) !== -1;
    var ps = pageSlice(this.history || [], this.st.page, this.st.per);
    this.st.page = ps.page;
    el('ppHistTable').innerHTML = tableHTML([
      { key: 'plan_date', label: 'วันที่' },
      { key: 'purchase_plan_no', label: 'เลขที่' },
      { key: 'required_date', label: 'ต้องการของ' },
      { key: 'vendor_name', label: 'Vendor' },
      { key: 'ingredient_name', label: 'วัตถุดิบ' },
      { key: 'final_purchase_quantity', label: 'จำนวนสั่ง', type: 'num' },
      { key: 'unit', label: 'หน่วย' },
      { key: 'estimated_amount', label: 'ประมาณการ', type: 'money' },
      { key: 'status', label: 'สถานะ', type: 'status' },
      { key: '_a', label: '', render: function(p) {
          if (!canWrite || p.status === 'received' || p.status === 'cancelled') return '';
          return '<button class="btn btn-outline btn-sm" onclick="PAGES.purchase.setStatus(\'' + esc(p.purchase_plan_no) + '\',\'' + (p.status === 'confirmed' ? 'ordered' : 'received') + '\')">' +
            (p.status === 'confirmed' ? '📞 สั่งซื้อแล้ว' : '📦 รับของแล้ว') + '</button>';
        } }
    ], ps.rows) + pagerHTML(ps, 'PAGES.purchase');
  },
  setStatus: function(ppNo, status) {
    var self = this;
    api('updatePurchasePlanStatus', { purchase_plan_no: ppNo, status: status }).then(function(res) {
      toast((res.success ? '✅ ' : '❌ ') + res.message, res.success ? 'success' : 'error');
      if (res.success) self.loadHistory();
    });
  },
  printPlans: function() {
    var rows = this.history || [];
    if (!rows.length) { toast('⚠️ ไม่มีข้อมูลให้พิมพ์', 'warning'); return; }
    var h = printHeader('แผนสั่งซื้อวัตถุดิบ (Purchase Plan)', 'ช่วงวันที่ ' + thaiDate(el('ppHFrom').value) + ' – ' + thaiDate(el('ppHTo').value));
    var byVendor = {};
    rows.forEach(function(p) { (byVendor[p.vendor_name] = byVendor[p.vendor_name] || []).push(p); });
    Object.keys(byVendor).forEach(function(vn) {
      h += '<h3 style="margin:12px 0 4px">🏪 ' + esc(vn) + '</h3>' +
        '<table><thead><tr><th>เลขที่</th><th>วัตถุดิบ</th><th style="text-align:right">จำนวน</th><th>หน่วย</th><th style="text-align:right">ประมาณการ</th><th>ต้องการของ</th></tr></thead><tbody>';
      byVendor[vn].forEach(function(p) {
        h += '<tr><td>' + esc(p.purchase_plan_no) + '</td><td>' + esc(p.ingredient_name) + '</td>' +
          '<td style="text-align:right">' + fmt(p.final_purchase_quantity) + '</td><td>' + esc(p.unit) + '</td>' +
          '<td style="text-align:right">' + money(p.estimated_amount) + '</td><td>' + thaiDate(p.required_date) + '</td></tr>';
      });
      h += '</tbody></table>';
    });
    h += '<div class="p-sign"><div>ผู้จัดทำ</div><div>ผู้ตรวจสอบ</div><div>ผู้อนุมัติ</div></div>';
    printHTML(h);
  }
};

PAGES.cost = {
  st: { groupBy: 'day' },
  render: function() {
    var presets = [
      ['today', 'วันนี้'], ['yesterday', 'เมื่อวาน'], ['this_week', 'สัปดาห์นี้'],
      ['last_week', 'สัปดาห์ก่อน'], ['this_month', 'เดือนนี้'], ['last_month', 'เดือนก่อน']
    ];
    el('content').innerHTML =
      '<div class="toolbar">' +
      '<select class="sel" id="costPreset" onchange="PAGES.cost.applyPreset(this.value)">' +
      presets.map(function(p) { return '<option value="' + p[0] + '"' + (p[0] === 'this_week' ? ' selected' : '') + '>' + p[1] + '</option>'; }).join('') +
      '<option value="custom">กำหนดเอง</option></select>' +
      '<input type="date" class="inp" style="width:auto" id="costFrom" value="' + mondayOf(todayStr()) + '" onchange="el(\'costPreset\').value=\'custom\';PAGES.cost.load()">' +
      '<span>ถึง</span><input type="date" class="inp" style="width:auto" id="costTo" value="' + todayStr() + '" onchange="el(\'costPreset\').value=\'custom\';PAGES.cost.load()">' +
      '<select class="sel" id="costGroup" onchange="PAGES.cost.st.groupBy=this.value;PAGES.cost.load()">' +
      '<option value="day">รายวัน</option><option value="category">ตามหมวดหมู่</option>' +
      '<option value="location">ตาม Location</option><option value="vendor">ตาม Vendor</option>' +

      '<span class="grow"></span>' +
      '<button class="btn btn-outline" onclick="PAGES.cost.exportDetail()">📊 Excel รายละเอียด</button>' +
      '</div><div id="costBody"></div>';
    this.load();
  },
  applyPreset: function(p) {
    var t = todayStr();
    var map = {
      today: [t, t], yesterday: [addDays(t, -1), addDays(t, -1)],
      this_week: [mondayOf(t), t], last_week: [addDays(mondayOf(t), -7), addDays(mondayOf(t), -1)],
      this_month: [t.slice(0, 8) + '01', t],
      last_month: [addDays(t.slice(0, 8) + '01', -1).slice(0, 8) + '01', addDays(t.slice(0, 8) + '01', -1)]
    };
    if (map[p]) { el('costFrom').value = map[p][0]; el('costTo').value = map[p][1]; this.load(); }
  },
  load: function() {
    var self = this, seq = nextSeq();
    el('costBody').innerHTML = '<div class="empty-state"><div class="spinner dark" style="margin:16px auto"></div></div>';

      date_from: el('costFrom').value, date_to: el('costTo').value,

      self.data = res.data;

        '<div class="kpi"><div class="k-ico">💸</div><div class="k-val">' + money(d.total_cost) + '</div><div class="k-lbl">ต้นทุนรวมช่วงที่เลือก</div></div>' +
        '<div class="kpi"><div class="k-ico">🧾</div><div class="k-val">' + fmt(d.details.length) + '</div><div class="k-lbl">จำนวนรายการเบิกจ่าย</div></div>' +
        '</div>';
      h += '<div class="grid-2"><div class="card"><div class="card-head"><h3>ต้นทุนตามกลุ่ม</h3></div><div class="chart-box"><canvas id="chCost"></canvas></div></div>';
      h += '<div class="card"><div class="card-head"><h3>สรุปตามกลุ่ม</h3></div>' +
        tableHTML([
          { key: 'key', label: 'กลุ่ม' },
          { key: 'items', label: 'รายการ', type: 'num' },
          { key: 'quantity', label: 'ปริมาณ', type: 'num' },
          { key: 'cost', label: 'ต้นทุน', type: 'money' }
        ], d.groups) + '</div></div>';
      h += '<div class="card"><div class="card-head"><h3>Daily Ingredient Cost (รายละเอียด)</h3><span class="grow"></span>' +
        '<span style="font-size:12px;color:var(--text-3)">พร้อมนำไปใช้ต่อใน Excel: วันที่ / วัตถุดิบ / จำนวน / ราคา / Vendor / Location</span></div>' +
        tableHTML([
          { key: 'date', label: 'วันที่' }, { key: 'reference_no', label: 'ใบเบิก' },
          { key: 'ingredient_name', label: 'วัตถุดิบ' }, { key: 'category_name', label: 'หมวด' },
          { key: 'quantity', label: 'จำนวนใช้', type: 'num' }, { key: 'unit', label: 'หน่วย' },
          { key: 'unit_price', label: 'ราคา/หน่วย', type: 'money' }, { key: 'total_amount', label: 'รวมเงิน', type: 'money' },
          { key: 'vendor_name', label: 'Vendor' }, { key: 'location_name', label: 'Location' }
        ], d.details.slice(0, 200)) +
        (d.details.length > 200 ? '<div style="font-size:12px;color:var(--text-3);margin-top:8px">แสดง 200 รายการแรก — Export Excel เพื่อดูทั้งหมด</div>' : '') + '</div>';
      el('costBody').innerHTML = h;
      makeChart('chCost', { type: 'bar',
        data: { labels: d.groups.map(function(g) { return g.key; }),
          datasets: [{ label: 'ต้นทุน (บาท)', data: d.groups.map(function(g) { return g.cost; }), backgroundColor: '#2563EB', borderRadius: 6 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
    });
  },
  exportDetail: function() {
    if (!this.data) { toast('⚠️ ยังไม่มีข้อมูล', 'warning'); return; }
    exportExcel('daily_ingredient_cost_' + el('costFrom').value + '_' + el('costTo').value, [
      { key: 'date', label: 'วันที่' }, { key: 'reference_no', label: 'ใบเบิก/เอกสาร' },
      { key: 'ingredient_name', label: 'วัตถุดิบ' }, { key: 'category_name', label: 'หมวดหมู่' },
      { key: 'quantity', label: 'จำนวนใช้' }, { key: 'unit', label: 'หน่วย' },
      { key: 'unit_price', label: 'ราคาต่อหน่วย' }, { key: 'total_amount', label: 'รวมเงิน' },
      { key: 'vendor_name', label: 'Vendor' }, { key: 'location_name', label: 'Location' }
    ], this.data.details);
  }
};

      '<option value="this_week" selected>สัปดาห์นี้</option><option value="last_week">สัปดาห์ก่อน</option>' +
      '<option value="this_month">เดือนนี้</option><option value="last_month">เดือนก่อน</option>' +
      '<option value="custom">กำหนดเอง</option></select>' +
      '<input type="date" class="inp" style="width:auto" id="rpFrom" value="' + mondayOf(todayStr()) + '" onchange="el(\'rpPreset\').value=\'custom\';PAGES.reports.load()">' +
      '<span>ถึง</span><input type="date" class="inp" style="width:auto" id="rpTo" value="' + todayStr() + '" onchange="el(\'rpPreset\').value=\'custom\';PAGES.reports.load()">' +
      '</div><div class="toolbar">' +
      '<select class="sel" id="rpLoc" onchange="PAGES.reports.load()">' + selOptions(APP.locations, 'location_id', 'location_code', '', 'ทุกคลัง') + '</select>' +
      '<select class="sel" id="rpCat" onchange="PAGES.reports.load()">' + selOptions(APP.categories, 'category_id', 'category_name', '', 'ทุกหมวดหมู่') + '</select>' +
      '<select class="sel" id="rpVen" onchange="PAGES.reports.load()">' + selOptions(APP.vendors, 'vendor_id', 'vendor_name', '', 'ทุก Vendor') + '</select>' +
      '<select class="sel" style="max-width:190px" id="rpIng" onchange="PAGES.reports.load()">' + selOptions(APP.ingredients, 'ingredient_id', 'ingredient_name', '', 'ทุกวัตถุดิบ') + '</select>' +
      '<span class="grow"></span>' +
      '<button class="btn btn-outline btn-sm" onclick="PAGES.reports.export(\'csv\')">📄 CSV</button>' +
      '<button class="btn btn-outline btn-sm" onclick="PAGES.reports.export(\'excel\')">📊 Excel</button>' +
      '<button class="btn btn-outline btn-sm" onclick="PAGES.reports.printReport()">🖨 Print</button>' +
      '</div></div><div id="rpBody"></div>';
    this.load();
  },
  applyPreset: function(p) {
    var t = todayStr();
    var map = {
      today: [t, t], yesterday: [addDays(t, -1), addDays(t, -1)],
      this_week: [mondayOf(t), t], last_week: [addDays(mondayOf(t), -7), addDays(mondayOf(t), -1)],
      this_month: [t.slice(0, 8) + '01', t],
      last_month: [addDays(t.slice(0, 8) + '01', -1).slice(0, 8) + '01', addDays(t.slice(0, 8) + '01', -1)]
    };
    if (map[p]) { el('rpFrom').value = map[p][0]; el('rpTo').value = map[p][1]; this.load(); }
  },
  load: function() {
    var self = this, seq = nextSeq();
    self.st.page = 1;
    el('rpBody').innerHTML = '<div class="empty-state"><div class="spinner dark" style="margin:16px auto"></div>กำลังสร้างรายงาน…</div>';
    api('getReport', {
      type: self.st.type, date_from: el('rpFrom').value, date_to: el('rpTo').value,
      location_id: el('rpLoc').value, category_id: el('rpCat').value,
      vendor_id: el('rpVen').value, ingredient_id: el('rpIng').value
    }).then(function(res) {
      if (!isLatest(seq) || APP.page !== 'reports') return;
      if (!res.success) { toast('❌ ' + res.message, 'error'); el('rpBody').innerHTML = ''; return; }
      self.data = res.data;
      self.draw();
    });
  },
  draw: function() {
    var d = this.data;
    if (!d) return;
    var ps = pageSlice(d.rows, this.st.page, this.st.per);
    this.st.page = ps.page;
    el('rpBody').innerHTML = '<div class="card"><div class="card-head"><h3>' + esc(d.title) + '</h3>' +
      '<span style="font-size:12.5px;color:var(--text-3)">' + thaiDate(d.date_from) + ' – ' + thaiDate(d.date_to) + '</span></div>' +
      tableHTML(d.columns, ps.rows) + pagerHTML(ps, 'PAGES.reports') + '</div>';
  },
  export: function(kind) {
    var d = this.data;
    if (!d || !d.rows.length) { toast('⚠️ ไม่มีข้อมูลให้ Export', 'warning'); return; }
    var name = this.st.type + '_' + el('rpFrom').value;
    if (kind === 'csv') exportCSV(name, d.columns, d.rows);
    else exportExcel(name, d.columns, d.rows);
  },
  printReport: function() {
    var d = this.data;
    if (!d || !d.rows.length) { toast('⚠️ ไม่มีข้อมูลให้พิมพ์', 'warning'); return; }
    var h = printHeader(d.title, 'ช่วงวันที่ ' + thaiDate(d.date_from) + ' – ' + thaiDate(d.date_to));
    h += '<table><thead><tr>' + d.columns.map(function(c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>';
    d.rows.forEach(function(r) {
      h += '<tr>' + d.columns.map(function(c) {
        var v = r[c.key];
        if (c.type === 'money') v = money(v);
        else if (c.type === 'num') v = fmt(v);
        return '<td' + ((c.type === 'money' || c.type === 'num') ? ' style="text-align:right"' : '') + '>' + esc(v) + '</td>';
      }).join('') + '</tr>';
    });
    h += '</tbody></table><div style="font-size:11px;margin-top:8px">พิมพ์เมื่อ ' + new Date().toLocaleString('th-TH') + ' · ' + esc(APP.user.fullname || APP.user.username) + '</div>';
    printHTML(h);
  }
};

/* ═══════════════════ PAGE: USERS ═══════════════════ */
PAGES.users = {
  st: { search: '', page: 1, per: 10 },
  setPage: function(p) { this.st.page = p; this.draw(); },
  setPer: function(p) { this.st.per = num(p); this.st.page = 1; this.draw(); },
  render: function() {
    el('content').innerHTML =
      '<div class="toolbar">' +
      '<div class="search-box"><input class="inp" placeholder="ค้นหาผู้ใช้…" oninput="PAGES.users.st.search=this.value;PAGES.users.st.page=1;PAGES.users.draw()"></div>' +
      '<span class="grow"></span>' +
      '<button class="btn btn-primary" onclick="PAGES.users.openForm()">➕ เพิ่มผู้ใช้</button>' +
      '</div><div id="usersTable"></div>';
    this.load();
  },
  load: function() {
    var self = this, seq = nextSeq();
    api('listUsers', null).then(function(res) {
      if (!isLatest(seq) || APP.page !== 'users') return;
      if (!res.success) { toast('❌ ' + res.message, 'error'); return; }
      self.list = res.data;
      self.draw();
    });
  },
  draw: function() {
    var self = this;
    var q = self.st.search.toLowerCase();
    var rows = (self.list || []).filter(function(u) {
      if (!q) return true;
      return (u.username + ' ' + u.fullname + ' ' + u.role + ' ' + (u.department || '')).toLowerCase().indexOf(q) !== -1;
    });
    rows.sort(function(a, b) { return (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1); });
    var ps = pageSlice(rows, self.st.page, self.st.per);
    self.st.page = ps.page;
    var stBadge = { pending: 'bg-yellow', active: 'bg-green', inactive: 'bg-gray', rejected: 'bg-red' };
    el('usersTable').innerHTML = tableHTML([
      { key: 'username', label: 'ชื่อผู้ใช้', render: function(u) { return '<b>' + esc(u.username) + '</b>'; } },
      { key: 'fullname', label: 'ชื่อ-นามสกุล' },
      { key: 'employee_code', label: 'รหัสพนักงาน' },
      { key: 'role', label: 'Role', render: function(u) { return '<span class="badge bg-blue">' + esc(u.role) + '</span>'; } },
      { key: 'department', label: 'แผนก' },
      { key: 'status', label: 'สถานะ', render: function(u) {
          return '<span class="badge ' + (stBadge[u.status] || 'bg-gray') + '">' + esc(u.status) + '</span>';
        } },
      { key: '_a', label: '', render: function(u) {
          var h = '<div style="display:flex;gap:6px;justify-content:flex-end">';
          if (u.status === 'pending') {
            h += '<button class="btn btn-success btn-sm" onclick="PAGES.users.quickStatus(\'' + u.user_id + '\',\'active\')">✅ อนุมัติ</button>' +
              '<button class="btn btn-danger btn-sm" onclick="PAGES.users.quickStatus(\'' + u.user_id + '\',\'rejected\')">ปฏิเสธ</button>';
          }
          h += '<button class="btn btn-ghost btn-sm" onclick="PAGES.users.openForm(\'' + u.user_id + '\')">✏️</button></div>';
          return h;
        } }
    ], ps.rows) + pagerHTML(ps, 'PAGES.users');
  },
  quickStatus: function(userId, status) {
    var self = this;
    api('saveUser', { user_id: userId, status: status }).then(function(res) {
      toast((res.success ? '✅ ' : '❌ ') + res.message, res.success ? 'success' : 'error');
      if (res.success) { self.load(); refreshMaster(true); }
    });
  },
  openForm: function(userId) {
    var u = userId ? (this.list || []).filter(function(x) { return x.user_id === userId; })[0] : null;
    UI.modal(u ? '✏️ แก้ไขผู้ใช้: ' + u.username : '➕ เพิ่มผู้ใช้',
      '<div class="form-grid">' +
      (!u ? '<div class="field"><label>ชื่อผู้ใช้ *</label><input class="inp" id="ufUser"></div>' +
        '<div class="field"><label>รหัสผ่าน *</label><input class="inp" id="ufPass" type="password"></div>' : '') +
      '<div class="field"><label>ชื่อ-นามสกุล</label><input class="inp" id="ufName" value="' + esc(u ? u.fullname : '') + '"></div>' +
      '<div class="field"><label>รหัสพนักงาน</label><input class="inp" id="ufEmp" value="' + esc(u ? u.employee_code : '') + '"></div>' +
      '<div class="field"><label>ตำแหน่ง</label><input class="inp" id="ufPos" value="' + esc(u ? u.position : '') + '"></div>' +
      '<div class="field"><label>แผนก</label><input class="inp" id="ufDept" value="' + esc(u ? u.department : '') + '"></div>' +
      '<div class="field"><label>Role</label><select class="sel" style="width:100%" id="ufRole">' +
      ['Admin','Supervisor','User','Viewer'].map(function(r) {
        return '<option' + (u && u.role === r ? ' selected' : (!u && r === 'User' ? ' selected' : '')) + '>' + r + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>สถานะ</label><select class="sel" style="width:100%" id="ufStatus">' +
      ['active','pending','inactive','rejected'].map(function(st) {
        return '<option' + (u && u.status === st ? ' selected' : '') + '>' + st + '</option>';
      }).join('') + '</select></div>' +
      (u ? '<div class="field full"><label>ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)</label><input class="inp" id="ufNewPass" type="password"></div>' : '') +
      '</div>',
      '<button class="btn btn-outline" onclick="UI.closeModal()">ยกเลิก</button>' +
      '<button class="btn btn-primary" id="btnUfSave" onclick="PAGES.users.save(' + (u ? '\'' + u.user_id + '\'' : 'null') + ')">บันทึก</button>');
  },
  save: function(userId) {
    var self = this;
    var payload = {
      user_id: userId || undefined,
      fullname: el('ufName').value.trim(), employee_code: el('ufEmp').value.trim(),
      position: el('ufPos').value.trim(), department: el('ufDept').value.trim(),
      role: el('ufRole').value, status: el('ufStatus').value
    };
    if (!userId) {
      payload.username = el('ufUser').value.trim();
      payload.password = el('ufPass').value;
      if (!payload.username || !payload.password) { toast('⚠️ กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'warning'); return; }
    } else if (el('ufNewPass') && el('ufNewPass').value) {
      payload.new_password = el('ufNewPass').value;
    }
    btnBusy('btnUfSave', true);
    api('saveUser', payload).then(function(res) {
      btnBusy('btnUfSave', false);
      toast((res.success ? '✅ ' : '❌ ') + res.message, res.success ? 'success' : 'error');
      if (res.success) { UI.closeModal(); self.load(); }
    }).catch(function() { btnBusy('btnUfSave', false); });
  }
};

        { key: 'reference_id', label: 'อ้างอิง' },
        { key: 'new_value', label: 'รายละเอียด', render: function(r) {
            return '<span style="font-size:11.5px;color:var(--text-2)">' + esc(String(r.new_value || '').slice(0, 120)) + '</span>';
          } }
      ], res.data.slice(0, 100)) + '<div style="font-size:12px;color:var(--text-3);margin-top:8px">แสดง 100 รายการล่าสุด</div></div>';
    });
  }
};
