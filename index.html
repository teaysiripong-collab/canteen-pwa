<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Canteen Inventory</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Canteen Inventory</h1>
    <div class="topbar-actions">
      <span id="sync-status" class="sync-status" title="Sync status">offline</span>
      <button id="btn-sync" class="icon-btn" title="Sync now" aria-label="Sync now">&#x21bb;</button>
    </div>
  </header>

  <main id="view-root">
    <!-- Items view -->
    <section id="view-items" class="view active">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search items&hellip;" autocomplete="off" />
        <select id="filter">
          <option value="all">All</option>
          <option value="low">Low stock</option>
          <option value="out">Out of stock</option>
        </select>
      </div>
      <div id="alerts" class="alerts" hidden></div>
      <ul id="items-list" class="items-list"></ul>
      <p id="empty-state" class="empty" hidden>No items yet. Tap + to add one.</p>
    </section>

    <!-- Item editor -->
    <section id="view-editor" class="view">
      <form id="item-form" class="form">
        <input type="hidden" name="id" />
        <label>
          Name
          <input name="name" type="text" required maxlength="80" />
        </label>
        <label>
          Barcode / SKU
          <div class="row">
            <input name="barcode" type="text" maxlength="64" autocomplete="off" />
            <button type="button" id="btn-scan-field" class="secondary">Scan</button>
          </div>
        </label>
        <label>
          Category
          <input name="category" type="text" list="category-list" maxlength="40" />
          <datalist id="category-list"></datalist>
        </label>
        <div class="grid-2">
          <label>
            Quantity
            <input name="quantity" type="number" min="0" step="1" value="0" required />
          </label>
          <label>
            Unit
            <input name="unit" type="text" maxlength="16" placeholder="pcs, kg, L&hellip;" />
          </label>
        </div>
        <div class="grid-2">
          <label>
            Price
            <input name="price" type="number" min="0" step="0.01" value="0" />
          </label>
          <label>
            Low-stock threshold
            <input name="threshold" type="number" min="0" step="1" value="5" required />
          </label>
        </div>
        <label>
          Notes
          <textarea name="notes" rows="2" maxlength="200"></textarea>
        </label>
        <div class="form-actions">
          <button type="button" id="btn-delete" class="danger" hidden>Delete</button>
          <button type="button" id="btn-cancel" class="secondary">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </section>

    <!-- Scanner view -->
    <section id="view-scanner" class="view">
      <div class="scanner-wrap">
        <video id="scanner-video" playsinline muted></video>
        <div class="scanner-overlay"><div class="scanner-frame"></div></div>
      </div>
      <p id="scanner-status" class="scanner-status">Point camera at a barcode&hellip;</p>
      <div class="form-actions">
        <button type="button" id="btn-scan-close" class="secondary">Close</button>
      </div>
    </section>

    <!-- Settings view -->
    <section id="view-settings" class="view">
      <form id="settings-form" class="form">
        <h2>Sync</h2>
        <label>
          Sync endpoint URL
          <input name="syncUrl" type="url" placeholder="https://your-backend.example/sync" autocomplete="off" />
        </label>
        <label>
          Auth token (optional)
          <input name="syncToken" type="password" autocomplete="off" />
        </label>
        <label class="checkbox">
          <input name="autoSync" type="checkbox" />
          Sync automatically when online
        </label>
        <h2>Defaults</h2>
        <label>
          Default low-stock threshold
          <input name="defaultThreshold" type="number" min="0" step="1" value="5" />
        </label>
        <h2>Data</h2>
        <div class="form-actions wrap">
          <button type="button" id="btn-export" class="secondary">Export JSON</button>
          <button type="button" id="btn-import" class="secondary">Import JSON</button>
          <input type="file" id="import-file" accept="application/json" hidden />
          <button type="button" id="btn-wipe" class="danger">Wipe all data</button>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary">Save settings</button>
        </div>
      </form>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="items">Items</button>
    <button class="tab" data-view="scanner">Scan</button>
    <button class="tab" data-view="settings">Settings</button>
  </nav>

  <button id="fab" class="fab" aria-label="Add item">+</button>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
