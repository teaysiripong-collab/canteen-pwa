<style>
/* =====================================================
   Canteen Smart Stock — Modern Corporate / Minimal
   สีหลัก: White + Navy + Blue | Status: Green/Yellow/Orange/Red
   ===================================================== */
:root {
  --navy: #1a2f5a;
  --blue: #2563eb;
  --blue-soft: #eff4ff;
  --bg: #f4f6fa;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --green: #16a34a;
  --yellow: #eab308;
  --orange: #f97316;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(26, 47, 90, .08), 0 4px 14px rgba(26, 47, 90, .06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', 'Sukhumvit Set', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px;
  padding-bottom: 76px; /* เผื่อ bottom nav */
}
.hidden { display: none !important; }

/* ===== Header ===== */
.app-header {
  position: sticky; top: 0; z-index: 30;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
}
.app-header-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.logo-dot { width: 10px; height: 10px; border-radius: 50%; background: #60a5fa; display: inline-block; }
.app-header-user { font-size: 12px; opacity: .85; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Employee bar ===== */
.employee-bar {
  background: var(--card); border-bottom: 1px solid var(--line);
  padding: 10px 16px; position: sticky; top: 46px; z-index: 25;
}
.employee-input-row { display: flex; gap: 8px; }
.employee-input { flex: 1; text-transform: uppercase; }
.employee-result { font-size: 13px; margin-top: 6px; min-height: 18px; }
.employee-result .ok { color: var(--green); font-weight: 600; }
.employee-result .err { color: var(--red); font-weight: 600; }
.employee-result .badge {
  display: inline-block; background: var(--blue-soft); color: var(--blue);
  border-radius: 999px; padding: 1px 10px; font-size: 12px; margin-left: 6px;
}

/* ===== Layout ===== */
.app-main { padding: 14px 12px; max-width: 1100px; margin: 0 auto; }
.page { display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px;
}
.card-title { font-weight: 700; font-size: 16px; color: var(--navy); margin-bottom: 12px; }
.card-subtitle { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }

/* ===== Home ===== */
.todo-card {
  background: linear-gradient(135deg, var(--navy), #274687);
  color: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
.todo-title { font-size: 13px; opacity: .8; margin-bottom: 8px; }
.todo-list { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.todo-item { display: flex; align-items: center; gap: 8px; }

.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.quick-btn {
  background: var(--card); border: none; border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: var(--navy);
}
.quick-btn:active { transform: scale(.97); }
.quick-icon { font-size: 24px; }

.cards-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px; text-align: center;
}
.stat-value { font-size: 24px; font-weight: 800; color: var(--navy); }
.stat-card.warn .stat-value { color: var(--orange); }
.stat-card.danger .stat-value { color: var(--red); }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ===== Forms ===== */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.input {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
  width: 100%;
}
.input:focus { outline: 2px solid var(--blue); border-color: var(--blue); }

.btn {
  border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px;
  font-weight: 700; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:disabled { background: #93b4f8; cursor: not-allowed; }
.btn-ghost { background: var(--blue-soft); color: var(--blue); }
.btn-lg { padding: 14px 22px; font-size: 16px; border-radius: 12px; }

.attach-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.attach-btn { cursor: pointer; }
.attach-status { font-size: 12px; color: var(--muted); }
.attach-status.ok { color: var(--green); font-weight: 600; }

/* ===== Grid table (Excel-like) ===== */
.table-card { padding: 12px; }
.table-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.table-hint { font-size: 11px; color: var(--muted); }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.grid { border-collapse: collapse; width: 100%; min-width: 720px; }
table.grid th {
  background: var(--blue-soft); color: var(--navy); font-size: 12px;
  padding: 8px 6px; text-align: left; position: sticky; top: 0;
}
table.grid td { border-bottom: 1px solid var(--line); padding: 2px; vertical-align: middle; }
table.grid .cell {
  border: 1px solid transparent; border-radius: 6px; padding: 8px 6px;
  font-size: 14px; width: 100%; font-family: inherit; background: transparent;
}
table.grid .cell:focus { outline: none; border-color: var(--blue); background: #fff; }
table.grid .cell[readonly] { color: var(--muted); background: #f8fafc; }
.col-no { width: 34px; } .col-item { min-width: 190px; } .col-qty { width: 90px; }
.col-unit { width: 70px; } .col-lot { width: 110px; } .col-date { width: 130px; }
.col-loc { width: 140px; } .col-price { width: 90px; } .col-del { width: 36px; }
.col-lots { min-width: 220px; }
.row-no { text-align: center; color: var(--muted); font-size: 12px; }
.row-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 15px; padding: 6px; }
tr.row-error td { background: var(--red-soft); }
.row-error-msg { color: var(--red); font-size: 11px; padding: 0 8px 6px; }
.stock-cell { font-size: 13px; color: var(--muted); text-align: right; padding-right: 8px; white-space: nowrap; }
.fefo-cell { font-size: 12px; color: var(--muted); padding: 4px 6px; }
.fefo-lot { display: inline-block; background: var(--blue-soft); color: var(--navy); border-radius: 6px; padding: 1px 8px; margin: 1px 3px 1px 0; }
.fefo-lot.warn { background: #fef9c3; color: #854d0e; }
.fefo-lot.bad { background: var(--red-soft); color: var(--red); }

.table-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.table-summary { font-size: 13px; color: var(--muted); }

/* ===== Autocomplete ===== */
.ac-dropdown {
  position: absolute; z-index: 60; background: #fff; border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); max-height: 260px; overflow-y: auto;
  min-width: 240px;
}
.ac-item { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.ac-item:hover, .ac-item.active { background: var(--blue-soft); }
.ac-item .ac-sub { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* ===== Stock list ===== */
.search-bar { display: flex; gap: 8px; }
.search-bar .input { flex: 1; }
.stock-list { display: flex; flex-direction: column; gap: 10px; }
.stock-item {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px;
}
.stock-item-name { font-weight: 700; color: var(--navy); }
.stock-item-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.stock-item-qty { text-align: right; font-weight: 800; font-size: 17px; white-space: nowrap; }
.stock-item-qty small { font-weight: 400; color: var(--muted); }
.badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 700; }
.badge-low { background: #fff7ed; color: var(--orange); }
.badge-expired { background: var(--red-soft); color: var(--red); }
.badge-ok { background: #f0fdf4; color: var(--green); }
.badge-warn { background: #fefce8; color: #854d0e; }

/* ===== Transaction list ===== */
.txn-list { display: flex; flex-direction: column; }
.txn-row { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.txn-row:last-child { border-bottom: none; }
.txn-main { flex: 1; }
.txn-doc { color: var(--muted); font-size: 11px; }
.txn-qty { font-weight: 700; white-space: nowrap; }
.txn-qty.in { color: var(--green); }
.txn-qty.out { color: var(--orange); }
.txn-meta { text-align: right; font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ===== Bottom nav ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding: 6px 0 10px;
}
.nav-btn {
  background: none; border: none; display: flex; flex-direction: column; align-items: center;
  gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 12px;
  font-family: inherit; font-weight: 600;
}
.nav-btn.active { color: var(--blue); }
.nav-icon { font-size: 20px; }

/* ===== Overlay / Success / Modal ===== */
.overlay {
  position: fixed; inset: 0; z-index: 80; background: rgba(15, 23, 42, .5);
  display: flex; align-items: center; justify-content: center; padding: 18px;
}
.overlay-card {
  background: #fff; border-radius: 18px; padding: 24px; width: 100%; max-width: 440px;
  max-height: 88vh; overflow-y: auto; position: relative;
}
.success-check {
  width: 64px; height: 64px; border-radius: 50%; background: #f0fdf4; color: var(--green);
  font-size: 36px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;
  font-weight: 800;
}
.success-title { text-align: center; font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 14px; }
.success-body { font-size: 14px; }
.success-body .kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.success-body .kv b { color: var(--navy); }
.success-lines { margin-top: 10px; font-size: 12px; color: var(--muted); max-height: 160px; overflow-y: auto; }
.overlay-actions { display: flex; gap: 10px; margin-top: 18px; }
.overlay-actions .btn { flex: 1; }
.modal-card { max-width: 520px; }
.modal-close {
  position: absolute; top: 10px; right: 12px; background: none; border: none;
  font-size: 18px; color: var(--muted); cursor: pointer; padding: 6px;
}

/* ===== Loading + Toast ===== */
.loading {
  position: fixed; inset: 0; z-index: 90; background: rgba(255,255,255,.75);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  font-weight: 700; color: var(--navy);
}
.spinner {
  width: 42px; height: 42px; border: 4px solid var(--blue-soft); border-top-color: var(--blue);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); z-index: 95;
  background: var(--navy); color: #fff; border-radius: 12px; padding: 12px 18px;
  font-size: 14px; box-shadow: var(--shadow); max-width: 92%; text-align: center;
}
.toast.error { background: var(--red); }

@media (min-width: 700px) {
  .app-main { padding: 20px; }
  .quick-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
